apiVersion: apps/v1
kind: Deployment
metadata:
  name: workflow-api
  namespace: ml-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: workflow-api
  template:
    metadata:
      labels:
        app: workflow-api
    spec:
      serviceAccountName: workflow-api
      containers:
        - name: api
          image: workflow-api:0.2.0
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8000
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: workflow-api
  namespace: ml-platform
spec:
  selector:
    app: workflow-api
  ports:
    - name: http
      port: 8000
      targetPort: http
  type: ClusterIP
