apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: ml-platform
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    rule_files:
      - /etc/prometheus/alerts/alerts.yml

    scrape_configs:
      - job_name: prometheus
        static_configs:
          - targets: ["localhost:9090"]

      - job_name: workflow-api
        metrics_path: /metrics
        static_configs:
          - targets: ["workflow-api.ml-platform.svc.cluster.local:8000"]