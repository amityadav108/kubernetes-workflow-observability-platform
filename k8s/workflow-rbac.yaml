
apiVersion: v1
kind: ServiceAccount
metadata:
  name: workflow-api
  namespace: ml-platform
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: workflow-api
  namespace: ml-platform
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: workflow-api
  namespace: ml-platform
subjects:
  - kind: ServiceAccount
    name: workflow-api
    namespace: ml-platform
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: workflow-api
